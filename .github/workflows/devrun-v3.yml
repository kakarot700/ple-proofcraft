name: dev-eval-v3
on:
  push:
    branches: [devrun-v3]
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SRC_RUN: "44689808066"
      TASKS: "engineers-estimate-check fire-solve-convergence solar-supplemental-review solar-witness-test-package foundation-strategy les-mesh-resolution"
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v4
        with: {ref: main, path: pc, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: devrun-v3, path: cfg, sparse-checkout: ci}
      - uses: astral-sh/setup-uv@v5
      - name: download runs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -x
          for t in $TASKS; do gh run download $SRC_RUN -R ${{ github.repository }} -n run-$t -D runs/run-$t || echo "NO_ARTIFACT $t"; done
          find runs -maxdepth 3 -name results.json
      - name: kit + proxy
        env: {NVIDIA_KEY: "${{ secrets.NVIDIA_KEY }}"}
        run: |
          git clone -q --depth 1 https://github.com/google-research/ple ple
          pip install -q 'litellm[proxy]'
          nohup litellm --config cfg/ci/nvproxy-regrade.yaml --host 0.0.0.0 --port 4000 > proxy.log 2>&1 &
          for i in $(seq 60); do curl -s -o /dev/null http://localhost:4000/health/liveliness && break; sleep 3; done
          uv tool install harbor==0.20.0 --with websockets
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: regrade
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
        run: |
          printf 'MODEL_PROXY_URL=http://localhost:4000\nMODEL_PROXY_KEY=sk-local-ple-dev\nJUDGE_MODEL=kimi-k3.1-pro\nHF_TOKEN=%s\n' "$HF_TOKEN" > local.env
          cd ple
          for t in $TASKS; do
            d=$GITHUB_WORKSPACE/runs/run-$t/$t
            [ -d "$d" ] || { echo "SKIP $t (no run dir)"; continue; }
            echo "######## $t"
            timeout 60m uv run python eval/run.py --regrade "$d" --env-file $GITHUB_WORKSPACE/local.env 2>&1 | tee -a $GITHUB_WORKSPACE/regrade.log || true
          done
          true
      - if: always()
        run: cp regrade.log proxy.log runs/ 2>/dev/null; true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "regraded-v3", path: runs/, retention-days: 90, include-hidden-files: true}

  task:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: [data-hall-mep-routing,data-hall-mep-routing-offset,mv-conveyance-study,frame-extension-method,fire-test-validation-memo,data-center-site-model,wind-diaphragm-shear]
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v4
        with: {ref: harness-v3, path: pc, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: devrun-v3, path: cfg, sparse-checkout: ci}
      - uses: astral-sh/setup-uv@v5
      - name: kit + proxy
        env: {NVIDIA_KEY: "${{ secrets.NVIDIA_KEY }}"}
        run: |
          git clone -q --depth 1 https://github.com/google-research/ple ple
          pip install -q 'litellm[proxy]'
          nohup litellm --config cfg/ci/nvproxy-regrade.yaml --host 0.0.0.0 --port 4000 > proxy.log 2>&1 &
          for i in $(seq 60); do curl -s -o /dev/null http://localhost:4000/health/liveliness && break; sleep 3; done
          docker version --format '{{.Server.Version}}'
          uv tool install harbor==0.20.0 --with websockets
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sleep $(( RANDOM % 120 ))
      - name: eval
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
        run: |
          set -o pipefail
          which harbor
          printf 'MODEL_PROXY_URL=http://localhost:4000\nMODEL_PROXY_KEY=sk-local-ple-dev\nJUDGE_MODEL=kimi-k3.1-pro\nHF_TOKEN=%s\n' "$HF_TOKEN" > local.env
          cd ple && timeout 340m uv run python eval/run.py $GITHUB_WORKSPACE/pc --tasks ${{ matrix.task }} --trials 2 --env-file $GITHUB_WORKSPACE/local.env --out $GITHUB_WORKSPACE/out/${{ matrix.task }} 2>&1 | tee $GITHUB_WORKSPACE/eval.log
      - if: always()
        run: mkdir -p out && cp eval.log proxy.log out/ 2>/dev/null; true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "v3-${{ matrix.task }}", path: out/, retention-days: 90, include-hidden-files: true}
